# Cyber Hub - feature request form (Developed by Syed Muhammad Tayyab)
name: ✨ Feature request
description: Suggest an idea for Cyber Hub
title: "[Idea]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work? Screens, settings, alerts?
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
