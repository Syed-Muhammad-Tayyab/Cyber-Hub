<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Cyber Hub - Developed by Syed Muhammad Tayyab">
  <!-- Cyber Hub banner - Developed by Syed Muhammad Tayyab -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b18"/><stop offset=".55" stop-color="#0a1830"/><stop offset="1" stop-color="#06202c"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#bfe3ff"/><stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity=".55"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".55"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#3b6fd8" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="400" rx="22"/></clipPath>
    <style>
      .spin{transform-origin:300px 200px;animation:spin 6s linear infinite}
      .spin2{transform-origin:300px 200px;animation:spin 14s linear infinite reverse}
      .pulse{transform-origin:300px 200px;animation:pulse 3s ease-in-out infinite}
      .check{stroke-dasharray:240;animation:draw 1.4s .4s ease-out both}
      .fade{animation:fade 1s ease-out both}
      .d1{animation-delay:.2s}.d2{animation-delay:.5s}.d3{animation-delay:.8s}.d4{animation-delay:1.1s}.d5{animation-delay:1.4s}
      .blink{animation:blink 1.6s ease-in-out infinite}
      .scan{animation:scan 4s ease-in-out infinite}
      .float{animation:float 7s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.12);opacity:1}}
      @keyframes draw{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}
      @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @keyframes blink{50%{opacity:.25}}
      @keyframes scan{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(410px);opacity:0}}
      @keyframes float{50%{transform:translateY(-12px)}}
      text{font-family:'Segoe UI','Segoe UI Variable Display',Roboto,'Helvetica Neue',Arial,sans-serif}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#22d3ee" opacity=".5"/>
    <!-- particles -->
    <g fill="#7dd3fc" class="float">
      <circle cx="120" cy="70" r="2" class="blink"/><circle cx="560" cy="60" r="1.6"/><circle cx="1080" cy="90" r="2.2" class="blink"/>
      <circle cx="1110" cy="320" r="1.8"/><circle cx="440" cy="372" r="2" class="blink"/><circle cx="70" cy="320" r="1.5"/>
      <circle cx="1140" cy="240" r="1.6" class="blink"/><circle cx="820" cy="40" r="1.4"/>
    </g>
    <!-- header credit -->
    <g class="fade">
      <rect x="40" y="26" width="360" height="34" rx="17" fill="#0f2142" stroke="#4f8cff" stroke-opacity=".55"/>
      <circle cx="62" cy="43" r="5" fill="#34d399" class="blink"/>
      <text x="76" y="48.5" font-size="15" fill="#dbe7ff" font-weight="600">Developed by Syed Muhammad Tayyab</text>
    </g>
    <!-- shield -->
    <circle cx="300" cy="200" r="150" fill="url(#glow)" class="pulse"/>
    <g class="spin2"><circle cx="300" cy="200" r="132" fill="none" stroke="#4f8cff" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 10"/></g>
    <g class="spin">
      <circle cx="300" cy="200" r="112" fill="none" stroke="#22d3ee" stroke-opacity=".25" stroke-width="2"/>
      <path d="M300 200 L412 200 A112 112 0 0 0 379 121 Z" fill="url(#sweep)" opacity=".7"/>
      <circle cx="412" cy="200" r="5" fill="#22d3ee"/>
    </g>
    <path d="M300 112 L368 138 L368 196 C368 238 340 268 300 284 C260 268 232 238 232 196 L232 138 Z" fill="url(#brand)"/>
    <path d="M300 128 L355 149 L355 196 C355 230 333 254 300 268 C267 254 245 230 245 196 L245 149 Z" fill="#0b1730" opacity=".9"/>
    <path class="check" d="M270 198 L292 220 L333 176" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- title -->
    <text x="500" y="178" font-size="84" font-weight="800" fill="url(#title)" letter-spacing="2" class="fade d1">CYBER HUB</text>
    <text x="503" y="222" font-size="22" fill="#9fb4dc" class="fade d2">Security center for your Windows PC &amp; online accounts</text>
    <g class="fade d3" font-size="14" font-weight="600">
      <rect x="503" y="246" width="128" height="30" rx="15" fill="#123058" stroke="#4f8cff" stroke-opacity=".6"/>
      <text x="567" y="266" text-anchor="middle" fill="#cfe1ff">v1.0.0 · stable</text>
      <rect x="643" y="246" width="152" height="30" rx="15" fill="#0f3a35" stroke="#34d399" stroke-opacity=".6"/>
      <text x="719" y="266" text-anchor="middle" fill="#a7f3d0">20 / 20 parts · 100%</text>
      <rect x="807" y="246" width="150" height="30" rx="15" fill="#2a2350" stroke="#a78bfa" stroke-opacity=".6"/>
      <text x="882" y="266" text-anchor="middle" fill="#ddd6fe">604 tests passing</text>
    </g>
    <g class="fade d4" font-size="13.5" fill="#7f93bb">
      <text x="503" y="318">Antivirus · Real-time · Firewall · Wi-Fi · Hardening · Password vault · Encryption</text>
      <text x="503" y="340">Threat intel · Web scanner · Accounts · Scheduler · Reports · Backups</text>
    </g>
    <text x="1170" y="380" text-anchor="end" font-size="12" fill="#4b5f88" class="fade d5">Python · FastAPI · SQLite · Windows 10/11</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="22" fill="none" stroke="#4f8cff" stroke-opacity=".35"/>
</svg>
