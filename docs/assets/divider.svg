<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="8" viewBox="0 0 1200 8">
  <!-- Cyber Hub divider - Developed by Syed Muhammad Tayyab -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0"/><stop offset=".3" stop-color="#4f8cff"/>
      <stop offset=".7" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <style>.m{animation:m 3.5s ease-in-out infinite}@keyframes m{0%{transform:translateX(-200px)}100%{transform:translateX(1200px)}}</style>
  </defs>
  <rect y="3" width="1200" height="2" rx="1" fill="url(#g)" opacity=".55"/>
  <rect class="m" y="2" width="200" height="4" rx="2" fill="#5eead4"/>
</svg>
